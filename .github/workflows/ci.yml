name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  task1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task1-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: task1-rag/requirements-local.txt
      - run: pip install -r requirements-local.txt pytest
      - run: python -m pytest -q

  task2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task2-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: task2-agent/requirements-local.txt
      - run: pip install -r requirements-local.txt pytest
      - run: python -m pytest -q

  task3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task3-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: task3-analyzer/requirements-local.txt
      - run: pip install -r requirements-local.txt pytest
      - run: python -m pytest -q